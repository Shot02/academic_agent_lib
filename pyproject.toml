[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-agentic"
version = "0.1.0"
description = "Organization-agnostic AI assistant for educational staff"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Otto Shalom", email = "shalomottodamilare@email.com" }
]
keywords = ["education", "ai", "agent", "langgraph", "fastapi", "llm"]

[project.urls]
Homepage = "https://github.com/Shot02/academic-agent"
Documentation = "https://academic-agent.readthedocs.io"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[dependencies]
langgraph = ">=0.2"
langchain-openai = ">=0.2"
pydantic = ">=2.8"
pydantic-settings = ">=2.4"
httpx = ">=0.27"
apscheduler = ">=3.10"
python-dotenv = ">=1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]